<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags & Technical SEO -->
  <title>Watch Room - YouTube Party</title>
  <meta name="title" content="Watch Room - YouTube Party">
  <meta name="description" content="Synchronized YouTube Watch Party Room with real-time video player, live chat, shared playlist queue, and video discovery.">
  <meta name="robots" content="noindex, follow">
  
  <!-- Favicon -->
  <link rel="icon" href="images/tab_logo.png" type="image/png">

  <!-- Fonts & Icon Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Top Navigation Bar -->
  <header class="navbar-custom">
    <div class="container-fluid px-2 px-md-3">
      
      <!-- Flex Header Wrapper -->
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 w-100">
        
        <!-- Brand Logo (Logo Image + Text on Desktop, Logo Image only on Mobile) -->
        <a class="navbar-brand-custom fs-6 text-decoration-none d-flex align-items-center gap-2 m-0" href="/" id="room-brand-logo">
          <img src="images/logo.png" alt="YouTube Watch Party Logo" width="32" height="23" id="room-logo-img">
          <span class="brand-text-full d-none d-md-inline">YouTube Watch <span class="text-gradient">Party</span></span>
        </a>

        <!-- Search & Video URL Input Form in Nav -->
        <form class="header-url-form my-0 flex-grow-1" id="url-form">
          <div class="header-url-input-group">
            <span class="input-group-text border-end-0">
              <i class="fa-solid fa-magnifying-glass text-danger"></i>
            </span>
            <input class="form-control-custom border-start-0 ps-0" id="url" type="search" placeholder="Search YouTube or paste URL..." aria-label="Search YouTube or Paste URL">
            <button class="btn-primary-custom" type="submit" id="btn-add-url">
              <i class="fa-solid fa-magnifying-glass me-1"></i> <span class="d-none d-sm-inline">Search</span>
            </button>
          </div>
        </form>

        <!-- Right Header Actions: Room ID, Copy Code, Copy Invite Link (Shown only to Host) -->
        <div class="header-room-actions d-none" id="host-room-actions">
          <div class="input-group input-group-sm">
            <input type="text" class="form-control-custom py-1 px-2 fs-7 text-center font-monospace" id="roomid" readonly value="ROOM-8924" title="Room Code">
            <button class="btn-secondary-custom py-1 px-2 fs-7 d-inline-flex align-items-center gap-1" id="btn-copy-roomid" type="button" title="Copy Room ID">
              <i class="fa-regular fa-copy"></i> <span>Code</span>
            </button>
            <button class="btn-secondary-custom py-1 px-2 fs-7 d-inline-flex align-items-center gap-1" id="btn-copy-link" type="button" title="Copy Invite Link">
              <i class="fa-solid fa-link text-warning"></i> <span>Invite</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  </header>

  <!-- Main Room Content -->
  <main class="container-fluid px-2 px-md-4 my-2 my-md-3">
    <div class="row g-3 g-md-4">
      
      <!-- Left Column: Video Player, Controls, Info & Below-Player Search Grid -->
      <div class="col-lg-8">
        
        <!-- Cinema Player Card -->
        <div class="player-wrapper">
          <div class="video-container">
            <div id="player">
              <iframe id="initial-yt-iframe" style="width:100%; height:100%; border:0; position:absolute; top:0; left:0;" src="https://www.youtube.com/embed/L7mfjvdnPno?autoplay=0&playsinline=1&enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>

          <!-- Synchronized Player Control Bar (Strictly In-App Embedded Playback) -->
          <div class="player-control-bar">
            <div class="player-controls-left">
              <!-- Previous Video Button -->
              <button class="btn-player btn-player-prev" id="prev-video" title="Previous Video in Queue">
                <i class="fa-solid fa-backward-step"></i> Previous
              </button>

              <!-- Next Video Button -->
              <button class="btn-player btn-player-next" id="next-video" title="Next Video in Queue">
                Next <i class="fa-solid fa-forward-step"></i>
              </button>
            </div>

            <!-- Sync Live Indicator & User Info -->
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span class="sync-badge" id="sync-status">
                <span class="sync-dot"></span> Sync Active
              </span>
              <span class="user-badge" id="greeting-text">
                <i class="fa-solid fa-user me-1 text-muted"></i> User: Guest
              </span>
            </div>
          </div>
        </div>

        <!-- Currently Playing Video Meta -->
        <div class="glass-panel p-3 my-2 my-md-3 now-playing-card">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="flex-grow-1 min-w-0">
              <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                <span class="badge bg-danger text-uppercase px-2 py-1 fs-8 fw-bold" style="border-radius: 4px; letter-spacing: 0.5px;">
                  <i class="fa-solid fa-circle-play me-1"></i> Now Playing
                </span>
                <span class="text-muted fs-7" id="channel-name">
                  <i class="fa-solid fa-circle-check text-primary me-1"></i> Synchronized Stream
                </span>
              </div>
              <h1 class="h5 mb-0 text-white fw-bold" id="video-title" style="line-height: 1.4; word-break: break-word;">
                YouTube Watch Party Player
              </h1>
            </div>
          </div>
        </div>

        <!-- Below-Player YouTube Discovery Feed -->
        <section class="glass-panel p-3 p-md-4 my-2 my-md-3">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <h2 class="h6 text-uppercase text-white fw-bold mb-0" style="letter-spacing: 0.5px;">
              <i class="fa-solid fa-fire text-danger me-2"></i> Watch More Songs
            </h2>
            <div class="category-pills" id="room-category-pills">
              <button class="cat-pill active" data-query="all">🔥 All Songs</button>
              <button class="cat-pill" data-query="famous_english">🎵 English Hits</button>
              <button class="cat-pill" data-query="bollywood">🇮🇳 Bollywood Hits</button>
              <button class="cat-pill" data-query="kk_songs">🎤 KK Songs</button>
              <button class="cat-pill" data-query="seedhe_maut">🎧 Seedhe Maut</button>
              <button class="cat-pill" data-query="punjabi">🎶 Punjabi Hits</button>
              <button class="cat-pill" data-query="gaming">🎮 Gaming & Tech</button>
            </div>
          </div>

          <!-- Video Grid Below Player -->
          <div class="video-grid" id="room-video-grid">
            <!-- Dynamically populated by room.js -->
          </div>

          <!-- Watch More Songs Interactive Action -->
          <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-10">
            <button class="btn-secondary-custom py-2 px-4 rounded-pill fw-bold" id="btn-watch-more-songs" title="Fetch more songs using YouTube API">
              <i class="fa-solid fa-arrows-rotate text-danger me-2"></i> Watch More Songs
            </button>
          </div>
        </section>

      </div>

      <!-- Right Column: Sidebar (Chat, Playlist Queue, Room Participants) -->
      <div class="col-lg-4">
        
        <!-- Pending Approval Requests Container for Host/Moderators -->
        <div id="approval-requests-container"></div>

        <div class="glass-panel sidebar-panel">
          
          <!-- Sidebar Tabs Header -->
          <div class="sidebar-tabs">
            <button class="tab-btn active" id="tab-btn-chat" data-tab="chat">
              <i class="fa-solid fa-comments"></i> Chat <span id="chat-unread-badge" class="badge bg-danger rounded-pill ms-1 d-none">0</span>
            </button>
            <button class="tab-btn" id="tab-btn-playlist" data-tab="playlist">
              <i class="fa-solid fa-list-ul"></i> Queue (<span id="playlist-count">0</span>)
            </button>
            <button class="tab-btn" id="tab-btn-members" data-tab="members">
              <i class="fa-solid fa-users"></i> Users (<span id="members-count">1</span>)
            </button>
          </div>

          <!-- Tab 1: Live Chat -->
          <div class="tab-content-area" id="tab-content-chat">
            <div class="chat-container">
              <div id="messages" class="chat-messages-box">
                <!-- Chat message pills dynamically added -->
              </div>
              <form id="message-form" class="chat-input-bar mt-1">
                <input id="inputMessage" type="text" class="form-control-custom" placeholder="Type a message..." autocomplete="off">
                <button id="submit-button" class="btn-primary-custom py-2 px-3" type="submit">
                  <i class="fa-solid fa-paper-plane"></i>
                </button>
              </form>
            </div>
          </div>

          <!-- Tab 2: Playlist Queue -->
          <div class="tab-content-area d-none" id="tab-content-playlist">
            <div id="videos-playlist-container">
              <p class="text-muted text-center py-4 fs-7" id="playlist-empty-msg">No videos in queue yet. Add one using the search below or paste a YouTube URL!</p>
              <div id="videos"></div>
            </div>
          </div>

          <!-- Tab 3: Members -->
          <div class="tab-content-area d-none" id="tab-content-members">
            <div id="users"></div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- Templates for Mustache rendering -->
  <script id="message-template" type="text/html">
    {{#isSystem}}
    <div class="chat-system-pill">
      <i class="fa-solid fa-circle-info text-info me-1"></i> {{message}}
    </div>
    {{/isSystem}}
    {{^isSystem}}
    <div class="chat-message-pill {{meClass}}">
      <div class="chat-author">
        {{username}} {{{badge}}} <span class="chat-time">{{time}}</span>
      </div>
      <div class="chat-text">{{message}}</div>
    </div>
    {{/isSystem}}
  </script>

  <script id="user-template" type="text/html">
    <div class="user-item">
      <div class="user-avatar">{{initial}}</div>
      <div class="flex-grow-1">
        <div class="d-flex align-items-center gap-2">
          <span class="fw-bold text-white fs-6">{{username}}</span>
          <span class="role-badge {{roleClass}}">{{{roleIcon}}} {{roleLabel}}</span>
        </div>
      </div>
      {{{hostControls}}}
    </div>
  </script>

  <!-- Toast Notification Container -->
  <div class="toast-container-custom" id="toast-container"></div>

  <!-- Scripts & Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.8/clipboard.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/room.js" type="text/javascript"></script>
</body>

</html>
